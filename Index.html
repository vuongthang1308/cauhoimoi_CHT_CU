<script>
let STATS = {};
let session = null;
const STORE_KEY = 'quiz-stats-' + TITLE;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function loadStats(){try{STATS=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');}catch(e){STATS={};}}
function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(STATS));}catch(e){}}
const main=document.getElementById('main'), headerTitle=document.getElementById('headerTitle'), backBtn=document.getElementById('backBtn');
function setHeader(t,showBack,fn){headerTitle.textContent=t;backBtn.style.visibility=showBack?'visible':'hidden';backBtn.onclick=fn||(()=>{});}

function renderHome(){
  setHeader(TITLE,false);
  main.innerHTML='';
  const lab=document.createElement('div');lab.className='section-label';lab.textContent='Bộ câu hỏi';main.appendChild(lab);
  const st=STATS.all;const pct=st&&st.seen?Math.round(100*st.correct/st.seen):null;
  const card=document.createElement('div');card.className='cat-card';
  card.innerHTML=`<div><div class="name">${TITLE}</div><div class="meta">${QUESTIONS.length} câu${st?` · đã làm ${st.seen}`:''}</div></div><div class="pct">${pct!==null?pct+'%':''}</div>`;
  main.appendChild(card);
  const ml=document.createElement('div');ml.className='section-label';ml.textContent='Số câu mỗi lượt';main.appendChild(ml);
  const grid=document.createElement('div');grid.className='mode-grid';
  [10,20,0].forEach(n=>{const b=document.createElement('div');b.className='mode-btn';
    b.innerHTML=`<div class="n">${n===0?'Tất cả':n}</div><div class="l">câu</div>`;
    b.onclick=()=>{[...grid.children].forEach(c=>c.style.borderColor='var(--line)');b.style.borderColor='var(--accent)';grid.dataset.chosen=n;};
    grid.appendChild(b);});
  grid.dataset.chosen=0;grid.children[2].style.borderColor='var(--accent)';
  main.appendChild(grid);
  const start=document.createElement('button');start.className='primary-btn';start.textContent='Bắt đầu làm bài';
  start.onclick=()=>startQuiz(parseInt(grid.dataset.chosen));main.appendChild(start);
  const reset=document.createElement('button');reset.className='secondary-btn';reset.textContent='Xoá tiến độ đã lưu';
  reset.onclick=()=>{if(confirm('Xoá toàn bộ thống kê đã lưu?')){STATS={};saveStats();renderHome();}};main.appendChild(reset);
}
function startQuiz(count){
  let pool=shuffle(QUESTIONS); if(count>0)pool=pool.slice(0,count);
  session={items:pool,idx:0,correctCount:0,wrongList:[]};renderQuestion();
}
function renderQuestion(){
  setHeader('Câu hỏi',true,renderHome);
  const {items,idx}=session;const q=items[idx];
  const order=q._o||(q._o=shuffle(q.options.map((_,i)=>i)));
  main.innerHTML='';
  const pw=document.createElement('div');pw.className='progress-wrap';
  pw.innerHTML=`<div class="progress-bar"><div class="progress-fill" style="width:${100*idx/items.length}%"></div></div><div class="progress-text">${idx+1}/${items.length}</div>`;
  main.appendChild(pw);
  const qe=document.createElement('div');qe.className='q-text';qe.textContent=q.question;main.appendChild(qe);
  const wrap=document.createElement('div');const fb=document.createElement('div');fb.className='feedback';
  let answered=false;
  order.forEach((oi,di)=>{
    const o=document.createElement('div');o.className='opt';
    const idxs=document.createElement('span');idxs.className='idx';idxs.textContent=String.fromCharCode(65+di)+'.';
    const tx=document.createElement('span');tx.textContent=q.options[oi];
    o.appendChild(idxs);o.appendChild(tx);
    o.onclick=()=>{
      if(answered)return;answered=true;
      const ok=oi===q.correct;
      [...wrap.children].forEach((el,i)=>{el.classList.add('disabled');if(order[i]===q.correct)el.classList.add('correct');});
      if(!ok)o.classList.add('wrong');
      fb.textContent=ok?'✓ Chính xác!':'✗ Chưa đúng — đáp án đúng đã được tô xanh.';
      fb.className='feedback '+(ok?'good':'bad');
      if(!STATS.all)STATS.all={seen:0,correct:0};STATS.all.seen++;if(ok)STATS.all.correct++;saveStats();
      if(ok)session.correctCount++;else session.wrongList.push({q,chosen:oi});
      next.disabled=false;
    };
    wrap.appendChild(o);
  });
  main.appendChild(wrap);main.appendChild(fb);
  const sp=document.createElement('div');sp.style.height='70px';main.appendChild(sp);
  const foot=document.createElement('footer');foot.className='quizfoot';
  const next=document.createElement('button');next.className='primary-btn';next.style.marginTop='0';
  next.textContent=idx+1<items.length?'Câu tiếp theo':'Xem kết quả';next.disabled=true;
  next.onclick=()=>{if(idx+1<items.length){session.idx++;renderQuestion();}else renderResult();};
  foot.appendChild(next);main.appendChild(foot);
}
function renderResult(){
  setHeader('Kết quả',true,renderHome);main.innerHTML='';
  const {items,correctCount,wrongList}=session;
  const box=document.createElement('div');box.className='result-score';
  box.innerHTML=`<div class="big">${correctCount}/${items.length}</div><div class="sub">${Math.round(100*correctCount/items.length)}% chính xác</div>`;
  main.appendChild(box);
  const retry=document.createElement('button');retry.className='primary-btn';
  retry.textContent=wrongList.length?`Làm lại ${wrongList.length} câu sai`:'Làm bài mới';
  retry.onclick=()=>{if(wrongList.length){session={items:shuffle(wrongList.map(w=>w.q)),idx:0,correctCount:0,wrongList:[]};renderQuestion();}else renderHome();};
  main.appendChild(retry);
  const home=document.createElement('button');home.className='secondary-btn';home.textContent='Về trang chủ';home.onclick=renderHome;main.appendChild(home);
  if(wrongList.length){
    const l=document.createElement('div');l.className='section-label';l.textContent='Xem lại câu sai';main.appendChild(l);
    wrongList.forEach(({q,chosen})=>{
      const w=document.createElement('div');w.className='wrong-item';
      const a=document.createElement('div');a.className='qq';a.textContent=q.question;
      const b=document.createElement('div');b.className='a you';b.textContent='Bạn chọn: '+q.options[chosen];
      const c=document.createElement('div');c.className='a right';c.textContent='Đáp án đúng: '+q.options[q.correct];
      w.appendChild(a);w.appendChild(b);w.appendChild(c);main.appendChild(w);
    });
  }
}
loadStats();renderHome();
</script>
